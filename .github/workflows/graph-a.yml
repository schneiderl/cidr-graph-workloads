name: Controlled graph experiment
run-name: ${{ inputs.correlation }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        required: true
        type: string
      cache_key:
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    name: checks
    needs:
      - summary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: node ci/execute.ts
        env:
          JOB_ID: checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-checks
          path: execution-checks/execution.json
          retention-days: 1
          if-no-files-found: error
  summary:
    name: summary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: node ci/execute.ts
        env:
          JOB_ID: summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-summary
          path: execution-summary/execution.json
          retention-days: 1
          if-no-files-found: error
